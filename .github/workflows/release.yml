name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        default: v1.2.0
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check version tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") {
            throw 'The tag does not match VERSION.'
          }
      - name: Build, test and package
        shell: pwsh
        run: ./build.ps1 -RunTests -Package
      - name: Publish executable and portable package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            'artifacts/AutoScrollWheel.exe',
            "artifacts/AutoScrollWheel-v$version-win.zip",
            'artifacts/SHA256SUMS.txt',
            '--verify-tag',
            '--title', "自动滚轮 $env:RELEASE_TAG",
            '--notes-file', 'CHANGELOG.md'
          )
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
